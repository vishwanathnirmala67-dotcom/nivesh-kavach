<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NiveshKavach - Owner view</title>
<link rel="icon" href="/assets/favicon.svg">
<style>
  :root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--mute:#475569;--line:#e2e8f0;--teal:#14b8a6}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c31;--ink:#f1f5f9;--mute:#94a3b8;--line:#1e2a44}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:1.5rem;margin:.2em 0 .1em} p{color:var(--mute);margin:.2em 0 1em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:200px;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit}
  button{padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#2563eb);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat b{display:block;font-size:2rem;color:var(--teal)} .stat span{color:var(--mute);font-size:.85rem}
  .wrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap} th{color:var(--mute);font-weight:600}
  #err{color:#dc2626;min-height:1.4em}
</style>
</head>
<body>
<main>
  <h1>NiveshKavach - Owner view</h1>
  <p>Shows name, email and counts only. Phone numbers, passwords and message text are never shown.</p>
  <div class="card">
    <form id="f" class="row" autocomplete="off">
      <input id="key" type="password" placeholder="Admin key" aria-label="Admin key" required>
      <button type="submit">Show users</button>
    </form>
    <div id="err" role="alert"></div>
  </div>
  <div id="out" hidden>
    <div class="card stats">
      <div class="stat"><b id="sTotal">0</b><span>Registered users</span></div>
      <div class="stat"><b id="sNew">0</b><span>New in 24 hours</span></div>
      <div class="stat"><b id="sChecks">0</b><span>Scam checks run</span></div>
    </div>
    <div class="card wrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Joined</th><th>Checks</th><th>Last check</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
